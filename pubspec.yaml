name: da1
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
    sdk: ^3.7.0

dependencies:
    flutter:
        sdk: flutter
    cupertino_icons: ^1.0.8
    lucide_icons_flutter: ^3.1.4
    flutter_bloc: ^9.1.1
    dio: ^5.3.3
    equatable: ^2.0.5
    go_router: ^17.2.2
    flutter_signin_button: ^2.1.1
    flutter_screenutil: ^5.9.3
    font_awesome_flutter: ^11.0.0
    syncfusion_flutter_gauges: ^33.2.3
    fl_chart: ^1.1.1
    flutter_secure_storage: ^10.0.0
    dartz: ^0.10.1
    intl: ^0.20.2
    jwt_decoder: ^2.0.1
    url_launcher: ^6.3.2
    app_links: ^7.0.0
    supabase_flutter: ^2.9.4
    flutter_dotenv: ^6.0.0
    image_picker: ^1.1.2
    camera: ^0.12.0+1
    permission_handler: ^12.0.1
    flutter_svg: ^2.2.3
    flutter_local_notifications: ^21.0.0
    firebase_core: ^4.7.0
    firebase_messaging: ^16.2.0
    device_info_plus: ^12.4.0

    health: ^13.3.1
    retrofit: ^4.9.2
    shared_preferences: ^2.5.5
    workmanager: ^0.9.0+3
    json_annotation: ^4.11.0
    flutter_webrtc: ^1.4.1
    socket_io_client: ^3.1.4
dev_dependencies:
    flutter_test:
        sdk: flutter
    integration_test:
        sdk: flutter

    flutter_lints: ^6.0.0
    flutter_launcher_icons: ^0.14.2

    build_runner: ^2.14.1
    json_serializable: ^6.13.1
    retrofit_generator: ^10.2.5
dependency_overrides:
    font_awesome_flutter: ^10.8.0
flutter:
    uses-material-design: true
    assets:
        - .env
        - assets/images/welcome1.jpeg
        - assets/images/welcome2.jpeg
        - assets/images/welcome3.jpeg
        - assets/icons/google_fit.svg

flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/icons/health-pal-logo.png"
    adaptive_icon_background: "#FFFFFF"
    adaptive_icon_foreground: "assets/icons/health-pal-logo.png"
    remove_alpha_ios: true
